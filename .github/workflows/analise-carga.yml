name: Análise eleitoral - carga TSE para Cloudflare

# Roda no ramo main quando muda analise/** (página e API do Mapa de Votos no Cloudflare). O GitHub Pages ignora a pasta analise/ (_config.yml).
on:
  push:
    branches: [main]
    paths: ["analise/**", ".github/workflows/analise-carga.yml"]
  workflow_dispatch:
    inputs:
      uf: { description: "UF", default: "CE" }
      ano: { description: "Ano", default: "2026" }
      turno: { description: "Turno", default: "1" }
      carga: { description: "Recarregar os dados do TSE no banco? (sim/nao)", default: "sim" }

concurrency: { group: analise-carga, cancel-in-progress: false }

permissions:
  contents: read

env:
  CLOUDFLARE_ACCOUNT_ID: 68a169c1926f5004bf8c7a975a4244ce
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  ANALISE_CHAVE: ${{ secrets.ANALISE_CHAVE }}
  BANCO: analise-eleitoral
  UF: ${{ inputs.uf || 'CE' }}
  ANO: ${{ inputs.ano || '2026' }}
  TURNO: ${{ inputs.turno || '1' }}

jobs:
  carga:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      # Os dados só são regravados quando pedido de propósito: execução manual com carga=sim,
      # ou um push cuja mensagem de commit tenha [carga]. O limite grátis do D1 é de 100 mil linhas gravadas por dia.
      # Ajustes da página/API só republicam o Worker (o plano grátis do D1 tem limite de linhas gravadas por dia).
      - name: Decidir se recarrega os dados
        id: d
        env:
          MSG: ${{ github.event.head_commit.message }}
        run: |
          C=0
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            [ "${{ inputs.carga }}" = "sim" ] && C=1
          else
            case "$MSG" in *"[carga]"*) C=1;; esac
          fi
          echo "carga=$C" >> "$GITHUB_OUTPUT"
          [ $C = 1 ] && echo "::notice title=dados::Recarregando os dados do TSE" || echo "::notice title=dados::Dados mantidos (só a página/API foi publicada)"

      - name: Baixar arquivos oficiais do TSE
        if: steps.d.outputs.carga == '1'
        run: |
          mkdir -p dl && cd dl
          B=https://cdn.tse.jus.br/estatistica/sead/odsele
          for u in "$B/votacao_secao/votacao_secao_${ANO}_${UF}.zip" \
                   "$B/votacao_secao/votacao_secao_${ANO}_BR.zip" \
                   "$B/eleitorado_locais_votacao/eleitorado_local_votacao_${ANO}.zip"; do
            echo "::group::$u"
            curl -fSL --retry 5 --retry-delay 10 -o "$(basename "$u")" "$u"
            echo "::endgroup::"
          done
          ls -lh

      - name: Gerar SQL
        if: steps.d.outputs.carga == '1'
        run: |
          python3 analise/carga/carga.py --ano "$ANO" --turno "$TURNO" --uf "$UF" --dir dl --saida carga.sql | tee resumo.json
          ls -lh carga.sql
          echo "::notice title=carga::$(python3 -c "import json;d=json.load(open('resumo.json'));d.pop('fontes');print(json.dumps(d,ensure_ascii=False))") | SQL $(du -h carga.sql | cut -f1)"
          echo '### Carga' >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"; cat resumo.json >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Garantir banco D1
        run: |
          cd analise/worker
          ID=$(npx -y wrangler@4 d1 list --json | python3 -c "import sys,json;print(next((d['uuid'] for d in json.load(sys.stdin) if d['name']=='$BANCO'),''))")
          if [ -z "$ID" ]; then
            npx -y wrangler@4 d1 create "$BANCO"
            ID=$(npx -y wrangler@4 d1 list --json | python3 -c "import sys,json;print(next(d['uuid'] for d in json.load(sys.stdin) if d['name']=='$BANCO'))")
          fi
          echo "ID do banco: $ID"
          sed "s/__DB_ID__/$ID/" wrangler.template.toml > wrangler.toml

      - name: Importar no D1
        if: steps.d.outputs.carga == '1'
        run: |
          cd analise/worker
          npx -y wrangler@4 d1 execute "$BANCO" --remote --file ../../carga.sql --yes

      - name: Publicar API (Worker)
        run: |
          cd analise/worker
          set +e
          npx -y wrangler@4 deploy > deploy.log 2>&1; RC=$?
          set -e
          cat deploy.log
          if [ $RC -ne 0 ]; then
            echo "::error title=deploy::$(grep -vE '^\s*$' deploy.log | tail -25 | sed 's/\x1b\[[0-9;]*m//g' | sed ':a;N;$!ba;s/\n/%0A/g')"
            exit $RC
          fi
          URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -1)
          echo "API: $URL" >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=api::$URL"
          # Link secreto (opcional): se o segredo ANALISE_CHAVE existir no GitHub, página e API só abrem com ?k=<chave>
          if [ -n "$ANALISE_CHAVE" ]; then
            printf '%s' "$ANALISE_CHAVE" | npx -y wrangler@4 secret put CHAVE >/dev/null && echo "::notice title=acesso::Link secreto ativo"
          else
            echo "::notice title=acesso::Sem link secreto (ANALISE_CHAVE não definido)"
          fi
          [ -n "$URL" ] && [ -z "$ANALISE_CHAVE" ] && { curl -fsS --retry 5 --retry-delay 5 "$URL/api/status" | tee -a "$GITHUB_STEP_SUMMARY"; } || true
