name: Painel 2º turno - As Cunhãs

# Publica o painel do 2º turno com a identidade do As Cunhãs (Worker "painel-ascunhas").
# Lê o coletor do Worker painel-2turno. O GitHub Pages ignora a pasta painel-ascunhas/. Só abre com o link secreto.
on:
  push:
    branches: [main]
    paths: ["painel-ascunhas/**", "painel/worker/src/mapa.json", ".github/workflows/painel-ascunhas.yml"]
  workflow_dispatch:

concurrency: { group: painel-ascunhas, cancel-in-progress: false }

permissions:
  contents: read

env:
  CLOUDFLARE_ACCOUNT_ID: 68a169c1926f5004bf8c7a975a4244ce
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

jobs:
  painel:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Publicar painel (Worker)
        if: hashFiles('painel-ascunhas/worker/wrangler.toml') != ''
        run: |
          cd painel-ascunhas/worker
          set +e
          npx -y wrangler@4 deploy > deploy.log 2>&1; RC=$?
          set -e
          cat deploy.log
          if [ $RC -ne 0 ]; then
            echo "::error title=deploy::$(grep -vE '^\s*$' deploy.log | tail -25 | sed 's/\x1b\[[0-9;]*m//g' | sed ':a;N;$!ba;s/\n/%0A/g')"
            exit $RC
          fi
          URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -1)
          echo "::notice title=painel::$URL"
          [ -n "$URL" ] && echo "::notice title=sem-chave::$(curl -s -o /dev/null -w '%{http_code}' "$URL/")" || true
