<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>As Cunhãs · Painel temporariamente fora do ar</title>
<style>
:root{--mag:#C42A55;--mag-2:#D2375F;--ama:#FDD71E;--bg:#FBF3E8;--ink:#3a0f1f;--ink-2:#6b3a4a;--card:#ffffff;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#2b0a18;--card:#3a1424;--ink:#fde4ec;--ink-2:#e8a9bb;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  display:grid;place-items:center;min-height:100vh;padding:24px max(16px,env(safe-area-inset-left)) 24px max(16px,env(safe-area-inset-right));line-height:1.5}
.card{width:min(460px,100%);background:var(--card);border-radius:28px;border-top:8px solid var(--mag);box-shadow:0 20px 60px -24px rgba(58,15,31,.35);padding:32px 26px 26px;text-align:center}
.marca{display:inline-flex;align-items:center;gap:10px;font-weight:900;letter-spacing:.06em;color:var(--mag-2);font-size:18px}
.marca svg{width:40px;height:40px}
h1{font-size:24px;line-height:1.2;margin:20px 0 10px;letter-spacing:-.01em}
p{margin:0 0 12px;color:var(--ink-2);font-size:15.5px}
.selo{display:inline-block;background:var(--ama);color:#3a0f1f;font-weight:800;font-size:13px;padding:6px 14px;border-radius:999px;margin-top:6px}
footer{margin-top:22px;padding-top:14px;border-top:1px solid rgba(196,42,85,.18);font-size:12.5px;color:var(--ink-2)}
footer b{color:var(--ink)}
</style>
</head>
<body>
<main class="card" role="main">
  <div class="marca" aria-label="As Cunhãs">
    <svg viewBox="0 0 40 40" aria-hidden="true"><path fill="#FDD71E" d="M20 2l4.2 8.1 8.5-3.4-3.4 8.5L37.4 20l-8.1 4.2 3.4 8.5-8.5-3.4L20 37.4l-4.2-8.1-8.5 3.4 3.4-8.5L2.6 20l8.1-4.2-3.4-8.5 8.5 3.4z"/><path fill="#C42A55" d="M14 21.5c1.5 3 3.7 4.5 6 4.5s4.5-1.5 6-4.5z"/></svg>
    AS CUNHÃS
  </div>
  <h1>Painel temporariamente fora do ar</h1>
  <p>O painel do 2º turno está indisponível no momento.</p>
  <p>Para mais informações, entre em contato com o desenvolvedor.</p>
  <span class="selo">Tritonia Soluções Tecnológicas</span>
  <footer>Painel do 2º turno desenvolvido para o podcast As Cunhãs.<br>Desenvolvido por <b>Tritonia Soluções Tecnológicas</b></footer>
</main>
</body>
</html>
